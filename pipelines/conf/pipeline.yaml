# Non-secret pipeline contract. Secrets live in GitHub Secrets / AWS IAM.
name: postgres_lake
schedule: "0 8 1 * *"  # 08:00 UTC on the 1st of every month; set to "manual" to disable cron

source:
  type: sqlalchemy  # chinook_sqlite | sqlalchemy
  schema: public
  tables: []        # empty = ingest all tables in schema
  write_disposition: replace  # replace | merge
  merge_keys: {}  # table -> list of primary key columns, required for merge

destination:
  aws_region: us-east-1
  s3_prefix: Test_data
  dataset: pg
  glue_database: glue_db_test
  file_format: parquet

tables: {}
